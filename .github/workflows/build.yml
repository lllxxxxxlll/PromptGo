name: Windows build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($version -ne $tauri -or $version -ne $cargo) { throw 'Package versions do not match' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package version' }
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Browser UI regression tests (not native cross-app paste tests)
        run: pnpm test:e2e
      - name: Build Windows installer
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json
      - name: Package standalone executable and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/portable | Out-Null
          Copy-Item src-tauri/target/release/promptmate.exe, LICENSE artifacts/portable/
          Copy-Item licenses artifacts/portable/ -Recurse
          Compress-Archive artifacts/portable/* artifacts/PromptMate-Community-windows-x64.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/
          Copy-Item LICENSE artifacts/
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PromptMate-Community-windows-x64
          path: artifacts/*
      - name: Create draft prerelease (manual publication)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @((Get-ChildItem artifacts -File).FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --prerelease --title "PromptMate Community $env:GITHUB_REF_NAME" --generate-notes
